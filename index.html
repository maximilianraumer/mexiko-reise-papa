<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>México · Dezember 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --panel:#fbfaf7; --ink:#22211f; --ink2:#4a4741; --muted:#8a857b; --line:#e2ded5; --line2:#d3cec3;
  --sea:#e4e9ea; --land:#f3f1ec; --land2:#e7e3db; --border:#c8c2b6;
  --accent:#3f5d55; --accent-soft:#e3ebe7;
  --ok:#4f7a5f; --ok-bg:#e4eee6; --open:#a26b25; --open-bg:#f5ead8; --check:#7a5a8a; --check-bg:#efe7f2;
  --sug:#4f6380; --sug-bg:#e7ebf1;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;height:100dvh}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 22px 12px}
header.top h1{font:500 22px/1.15 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);white-space:nowrap}
.pill b{font-weight:600;color:var(--ink)}
nav.days{display:flex;gap:6px;overflow-x:auto;padding:4px 22px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.days::-webkit-scrollbar{display:none}
nav.days a{flex:none;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:44px;height:46px;padding:0 10px;border-radius:10px;border:1px solid transparent;color:var(--ink2);font-size:11px;line-height:1.1;transition:background .15s,border-color .15s}
nav.days a b{font-size:15px;font-weight:500;color:var(--ink);margin-top:2px}
nav.days a.wide{flex-direction:row;gap:6px;font-size:13px;font-weight:500;color:var(--ink)}
nav.days a:hover{background:var(--panel);border-color:var(--line)}
nav.days a.on{background:var(--ink);color:#e9e6df;border-color:var(--ink)}
nav.days a.on b{color:#fff}
nav.days a.today:not(.on){border-color:var(--accent)}
nav.days .sep{flex:none;width:1px;background:var(--line);margin:6px 4px}
main{display:grid;grid-template-columns:58% 42%;min-height:0;transition:grid-template-columns .45s ease}
body.v-day main{grid-template-columns:40% 60%}
.map-pane{position:relative;min-height:0;padding:14px 0 14px 14px}
#map{position:absolute;inset:14px 0 14px 14px;border-radius:16px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.content{overflow-y:auto;padding:22px 26px 60px;min-height:0}
/* svg map */
.svgmap{display:block;cursor:grab;touch-action:none}
.svgmap:active{cursor:grabbing}
.land{fill:var(--land2);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.land.mx{fill:var(--land)}
.route{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.route.flight{stroke:#8d8579;stroke-width:1.5;stroke-dasharray:5 5}
.route.bus,.route.car{stroke:var(--accent);stroke-width:2.2}
.route.boat{stroke:#6c8a9b;stroke-width:1.8;stroke-dasharray:1.5 4.5}
.route.dim{opacity:.22}
.route.hi.flight{stroke:var(--ink);stroke-width:2}
.route.hi.bus,.route.hi.car{stroke-width:3}
.pt{cursor:pointer}
.pt circle.halo{fill:rgba(63,93,85,.14);stroke:none;opacity:0;transition:opacity .2s}
.pt.on circle.halo{opacity:1}
.pt circle.dot{fill:var(--ink);stroke:#fff;stroke-width:2}
.pt.minor circle.dot{fill:var(--muted)}
.pt.stop circle.dot{fill:var(--accent)}
.pt.on circle.dot{fill:var(--ink)}
.pt text.n{fill:#fff;font:600 10.5px Inter,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pt text.lb{font:500 11.5px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:rgba(245,243,238,.92);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.pt.minor text.lb{font-size:10.5px;fill:var(--ink2)}
.pt.stop text.lb{opacity:0;transition:opacity .15s}
.pt.stop.on text.lb,.pt.stop.lbl text.lb{opacity:1}
.map-ui{position:absolute;display:flex;gap:6px;z-index:3}
.map-ui.zoom{right:12px;top:12px;flex-direction:column}
.map-ui button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(251,250,247,.95);color:var(--ink);font:500 16px Inter;cursor:pointer;display:grid;place-items:center}
.map-ui button:hover{background:#fff}
.legend{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;gap:12px;align-items:center;padding:6px 10px;border-radius:9px;background:rgba(251,250,247,.92);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:5px}
#map.gm .legend{bottom:auto;top:12px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.legend i.f{border-top:2px dashed #8d8579}
.legend i.b{border-top:2px dotted #6c8a9b}
.mapnote{position:absolute;left:12px;top:12px;z-index:3;font-size:11px;color:var(--muted);background:rgba(251,250,247,.92);border:1px solid var(--line);padding:4px 9px;border-radius:8px;max-width:60%}
.pop{position:absolute;z-index:4;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:12.5px;box-shadow:0 6px 24px rgba(30,28,24,.12);transform:translate(-50%,calc(-100% - 14px));min-width:150px;max-width:230px}
.pop b{display:block;font-weight:600;margin-bottom:4px}
.pop a{display:inline-flex;align-items:center;gap:4px;color:var(--accent);text-decoration:none;font-weight:500}
.pop a svg.i{width:13px;height:13px}
/* content */
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
h2.big{font:400 30px/1.15 Fraunces,Georgia,serif;margin:6px 0 6px;letter-spacing:-.015em}
h3.sec{font:500 12px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px}
.lead{color:var(--ink2);margin:0}
.progress{display:flex;gap:3px;margin:16px 0 4px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--ink)}
.progress-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;display:block}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font:400 22px/1.2 Fraunces,serif;margin-top:3px}
.stat .v small{font:400 13px Inter;color:var(--muted)}
.stat .s{font-size:12px;color:var(--ink2);margin-top:2px}
a.stat:hover{border-color:var(--line2)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;width:100%;text-align:left;font:inherit;color:inherit;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:#fff}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--line2)}
.row .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--bg);color:var(--ink2);flex:none}
.dnum{width:40px;flex:none;text-align:center;font-size:11px;color:var(--muted);line-height:1.1}
.dnum b{display:block;font:400 19px Fraunces,serif;color:var(--ink)}
.row.today .dnum b{color:var(--accent)}
.dots{display:flex;gap:4px}
.dots span{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.dots span svg.i{width:13px;height:13px}
.st-gebucht{color:var(--ok);background:var(--ok-bg)}
.st-offen{color:var(--open);background:var(--open-bg)}
.st-pruefen{color:var(--check);background:var(--check-bg)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.stage-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.stage-h b{font:500 15px Fraunces,serif}
.stage-h span{font-size:12px;color:var(--muted)}
.dl .when{font:400 17px Fraunces,serif;width:56px;flex:none}
.dl .rem{font-size:12px;color:var(--muted);white-space:nowrap}
/* day view */
.dayhead{display:flex;gap:12px;align-items:flex-start}
.dayhead .mid{flex:1}
.navbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;text-decoration:none;color:var(--ink2);flex:none;margin-top:4px}
.navbtn:hover{background:#fff}
.navbtn.off{opacity:.3;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line2);background:#fff}
.card .h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .kind{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.card b{font-weight:500;line-height:1.3}
.card small{color:var(--ink2);font-size:12.5px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:1px;background:var(--line2)}
.timeline li{display:flex;gap:14px;padding:10px 10px 10px 0;border-radius:10px;position:relative;cursor:default;transition:background .15s}
.timeline li[data-p]{cursor:pointer}
.timeline li.on{background:var(--accent-soft)}
.timeline .n{width:27px;height:27px;border-radius:50%;background:var(--accent);color:#fff;font:600 11.5px Inter;display:grid;place-items:center;flex:none;position:relative;z-index:1;border:2px solid var(--bg)}
.timeline .n.none{background:var(--line2)}
.timeline .tm{width:84px;flex:none;font-size:12.5px;color:var(--muted);padding-top:4px;font-variant-numeric:tabular-nums}
.timeline .bd{flex:1;min-width:0;padding-top:3px}
.timeline .bd b{font-weight:500;display:block;line-height:1.35}
.timeline .bd p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.timeline .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11.5px Inter;padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);text-decoration:none;cursor:pointer}
.chip:hover{background:#fff;border-color:var(--line2)}
.chip svg.i{width:13px;height:13px}
.chip.st-gebucht,.chip.st-offen,.chip.st-pruefen{border-color:transparent}
.sug{display:flex;gap:10px;background:var(--sug-bg);color:var(--sug);border-radius:var(--r);padding:12px 14px;margin-top:10px;font-size:13px}
.sug b{font-weight:600}
.sug p{margin:0;color:#3d4c62}
.warn{display:flex;gap:8px;background:var(--open-bg);color:#7c5219;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.filters{display:flex;gap:6px;margin:18px 0 0}
.filters button{font:500 12.5px Inter;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(34,33,31,.32);animation:fade .2s}
.sheet-card{position:relative;background:var(--panel);border-radius:18px;width:min(480px,calc(100% - 32px));max-height:86vh;overflow:auto;padding:22px 22px 20px;box-shadow:0 20px 60px rgba(30,28,24,.2);animation:up .25s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.sheet-card .x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.sheet-card h2{font:400 23px/1.2 Fraunces,serif;margin:8px 40px 4px 0}
.kv{margin:16px 0 0;border-top:1px solid var(--line)}
.kv div{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv dt{width:96px;color:var(--muted);flex:none}
.kv dd{margin:0;flex:1}
.info{margin:14px 0 0;padding:0 0 0 18px;color:var(--ink2);font-size:13px}
.info li{margin:3px 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border-radius:10px;font:500 13px Inter;text-decoration:none;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:hover{filter:brightness(1.05)}
.missing{border:1px dashed var(--line2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-top:18px}
@media (max-width:900px){
  .app{display:block;height:auto}
  header.top{padding:14px 16px 10px}
  header.top h1{font-size:20px}
  nav.days{padding:4px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:20}
  main{display:block}
  .map-pane{height:46vh;padding:10px 12px 0}
  #map{inset:10px 12px 0 12px}
  body.v-day .map-pane{height:34vh;position:sticky;top:61px;z-index:10;background:var(--bg);padding-bottom:8px}
  body.v-day #map{bottom:8px}
  .content{padding:18px 16px 60px;overflow:visible}
  h2.big{font-size:26px}
  .timeline .tm{width:68px}
  .sheet{align-items:flex-end}
  .sheet-card{width:100%;border-radius:18px 18px 0 0;max-height:88vh;animation:up .25s ease}
  .pill.hide-m{display:none}
  .mapnote{display:none}
  .row .t b{white-space:normal;line-height:1.3}
  .map-ui.zoom button[data-z="in"],.map-ui.zoom button[data-z="out"]{display:none}
  .legend{gap:9px;padding:4px 8px;font-size:10.5px;left:8px;bottom:8px}
  .map-ui.zoom{right:8px;top:8px}
}
</style>
</head>

/* ---------- views ---------- */
function vOverview(){

    <a class="stat" href="#buchungen"><div class="k">Aktivitäten vorab buchen</div><div class="v">${actOpen} <small>offen</small></div><div class="s">+ ${ACTS.filter(([,b])=>b.optional).length} optional</div></a>
    <div class="stat"><div class="k">Nächste Frist</div>${dl[0]?`<div class="v">${dShort(dl[0].d)} <small>${remTxt(daysFrom(dl[0].d))}</small></div><div class="s">${esc(dl[0].b.title)}</div>`:'<div class="v">–</div>'}</div>

  if(dl.length){
    h += `<h3 class="sec">Anstehende Fristen</h3><div class="list">` + dl.map(x=>`<button class="row dl" data-b="${x.id}"><span class="when">${dShort(x.d)}</span><span class="t"><b>${esc(x.b.title)}</b><small>${esc(x.t)}</small></span><span class="rem">${remTxt(daysFrom(x.d))}</span></button>`).join('') + `</div>`;

    h += `<div class="stage-h"><b>${esc(st.name)}</b><span>${st.range}</span></div><div class="list">`;
    ds.forEach(d=>{ const i=DAYIDX[d.date];
      const dots = dayBookings(d).map(id=>{const b=BOOKINGS[id]; return `<span class="st-${b.status}" title="${esc(b.title)} · ${stLabel(b)}">${ico(b.kind)}</span>`}).join('');
      h += `<a class="row ${curIdx===i?'today':''}" href="#tag-${dd(d.date)}"><span class="dnum">${WD[dObj(d.date).getDay()]}<b>${dd(d.date)}</b></span><span class="t"><b>${esc(d.title)}</b><small>${d.sleep?'Übernachtung: '+esc(BOOKINGS[d.sleep].title):'Ende der Reise'}</small></span><span class="dots">${dots}</span>${ico('chev','chev')}</a>`;

}

function dayPlaces(day){
  const order=[]; day.items.forEach(it=>{ if(it[3] && !order.includes(it[3])) order.push(it[3]); });
  return order;
}
function vDay(i){
  const d = DAYS[i], st = STAGE[d.stage], places = dayPlaces(d);
  const prev = DAYS[i-1], next = DAYS[i+1];
  let h = `<div class="dayhead">
    <a class="navbtn ${prev?'':'off'}" href="${prev?'#tag-'+dd(prev.date):'#'}" aria-label="Vorheriger Tag">${ico('left')}</a>
    <div class="mid"><div class="eyebrow">Tag ${i+1} von ${tripLen} · ${esc(st.name)}</div><h2 class="big">${esc(d.title)}</h2><p class="lead">${dLong(d.date)}</p></div>
    <a class="navbtn ${next?'':'off'}" href="${next?'#tag-'+dd(next.date):'#'}" aria-label="Nächster Tag">${ico('chev')}</a></div>`;
  const bs = dayBookings(d);
  if(bs.length){
    h += `<div class="cards">` + bs.map(id=>{const b=BOOKINGS[id]; return `<button class="card" data-b="${id}"><span class="h"><span class="kind">${ico(b.kind)}${KIND[b.kind]}</span>${badge(b)}</span><b>${esc(b.title)}</b><small>${esc(b.time||'')}</small></button>`}).join('') + `</div>`;
  }
  h += `<h3 class="sec">Tagesablauf</h3><ol class="timeline">`;
  d.items.forEach(it=>{
    const [tm,title,note,pl,bk] = it; const n = pl ? places.indexOf(pl)+1 : 0;
    const b = bk && BOOKINGS[bk];
    h += `<li ${pl?`data-p="${pl}"`:''}><span class="n ${n?'':'none'}">${n||''}</span><span class="tm">${esc(tm)}</span><div class="bd"><b>${esc(title)}</b>${note?`<p>${esc(note)}</p>`:''}<div class="acts">`
      + (b?`<button class="chip st-${b.status}" data-b="${bk}">${ico(b.kind)}${KIND[b.kind]} · ${stLabel(b)}</button>`:'')
      + (pl?`<a class="chip" href="${gq(pl)}" target="_blank" rel="noopener">${ico('pin')}Google Maps</a>`:'')

  });

  (d.sug||[]).forEach(s=>{ h += `<div class="sug">${ico('bulb')}<p><b>Vorschlag:</b> ${esc(s)}</p></div>`; });
  return h;
}

let filter = 'alle';
function vBookings(){
  const groups = [
    ['Flüge, Bus & Mietwagen', ['flight','bus','car']],
    ['Unterkünfte', ['hotel']],
    ['Aktivitäten mit Vorab-Buchung', ['activity']],
  ];
  const all = Object.entries(BOOKINGS);
  const cnt = s => all.filter(([,b])=>s==='alle'||(s==='offen'?b.status!=='gebucht':b.status==='gebucht')).length;
  let h = `<div class="eyebrow">Alle Buchungen</div><h2 class="big">Buchungen & Status</h2><p class="lead">Antippen für Details, Links und Fristen.</p>
  <div class="filters">${[['alle','Alle'],['offen','Offen'],['gebucht','Gebucht']].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l} · ${cnt(k)}</button>`).join('')}</div>`;
  groups.forEach(([name,kinds])=>{
    const rows = all.filter(([,b])=>kinds.includes(b.kind)).filter(([,b])=>filter==='alle'||(filter==='offen'?b.status!=='gebucht':b.status==='gebucht')).sort((a,b)=>a[1].date.localeCompare(b[1].date));

    h += `<h3 class="sec">${name}</h3><div class="list">` + rows.map(([id,b])=>`<button class="row" data-b="${id}"><span class="ico">${ico(b.kind)}</span><span class="t"><b>${esc(b.title)}</b><small>${b.kind==='hotel'?esc(b.time):dShort(b.date)+(b.time?' · '+esc(b.time):'')}</small></span>${badge(b)}${ico('chev','chev')}</button>`).join('') + `</div>`;

/* ---------- detail sheet ---------- */
function openSheet(id){
  const b = BOOKINGS[id]; if(!b) return;
  const kv = [];
  if(b.who) kv.push(['Reisende', b.who]);
  kv.push(['Datum', b.until ? `${dShort(b.date)} – ${dShort(b.until)}` : dLong(b.date)]);
  if(b.time) kv.push([b.kind==='hotel'?'Aufenthalt':'Zeit', b.time]);
  if(b.from) kv.push(['Von', P(b.from)[2]]);
  if(b.to) kv.push(['Nach', P(b.to)[2]]);
  if(b.where) kv.push(['Ort', P(b.where)[2]]);
  (b.deadlines||[]).forEach(x=>kv.push(['Frist '+dShort(x.d), x.t]));
  const dayI = DAYIDX[b.date];
  let h = `<button class="x" data-close aria-label="Schließen">${ico('x')}</button>
    <div class="h" style="display:flex;gap:8px;align-items:center"><span class="eyebrow" style="display:flex;gap:6px;align-items:center">${ico(b.kind)}${KIND[b.kind]}</span>${badge(b)}</div>
    <h2>${esc(b.title)}</h2>
    <dl class="kv">${kv.map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    ${b.info&&b.info.length?`<ul class="info">${b.info.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${b.warn?`<div class="warn">${ico('alert')}<span>${esc(b.warn)}</span></div>`:''}`;
  const btns = [];
  if(b.link) btns.push(`<a class="btn primary" href="${esc(b.link)}" target="_blank" rel="noopener">Buchung öffnen ${ico('ext')}</a>`);
  if(b.from && b.to) btns.push(`<a class="btn" href="${gdir(b.from,b.to)}" target="_blank" rel="noopener">${ico('pin')}Route in Google Maps</a>`);
  else if(b.where||b.to) btns.push(`<a class="btn" href="${gq(b.where||b.to)}" target="_blank" rel="noopener">${ico('pin')}In Google Maps</a>`);
  if(dayI!==undefined) btns.push(`<a class="btn" href="#tag-${dd(b.date)}" data-close>Zum Tag ${dShort(b.date)}</a>`);
  if(!b.link) h += `<div class="missing">Noch kein Buchungslink hinterlegt – sobald gebucht, Link in den Reisedaten ergänzen.</div>`;
  h += `<div class="btns">${btns.join('')}</div>`;
  $('#sheet-card').innerHTML = h;
  $('#sheet').hidden = false;
}
function closeSheet(){ $('#sheet').hidden = true; }
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-close]'); if(c){ closeSheet(); if(c.tagName!=='A') return; }
  const b = e.target.closest('[data-b]'); if(b){ e.preventDefault(); openSheet(b.dataset.b); return; }
  const f = e.target.closest('[data-f]'); if(f){ filter=f.dataset.f; $('#content').innerHTML=vBookings(); return; }
  const li = e.target.closest('.timeline li[data-p]'); if(li && !e.target.closest('a,button')){ highlight(li.dataset.p, true); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* ---------- map: SVG fallback ---------- */
class SvgMap{
  constructor(el, cb){
    this.el=el; this.cb=cb; this.t=d3.zoomIdentity; this.st={points:[],legs:[],focus:[]};
    this.svg=d3.select(el).append('svg').attr('class','svgmap');
    this.svg.append('rect').attr('width','100%').attr('height','100%').attr('fill','var(--sea)');
    this.gW=this.svg.append('g'); this.gL=this.gW.append('g'); this.gR=this.gW.append('g'); this.gP=this.svg.append('g');
    this.zoom=d3.zoom().scaleExtent([.7,6000]).on('zoom',e=>{this.t=e.transform;this.apply();if(e.sourceEvent)this.hidePop();});
    this.svg.call(this.zoom).on('dblclick.zoom',null);
    this.svg.on('click',e=>{ if(e.target.tagName==='rect'||e.target.classList.contains('land')) this.hidePop(); });
    this.land=topojson.feature(BASE,BASE.objects.land);
    this.proj=d3.geoMercator(); this.path=d3.geoPath(this.proj);
    this.pop=document.createElement('div'); this.pop.className='pop'; this.pop.hidden=true; el.appendChild(this.pop);
    el.insertAdjacentHTML('beforeend',`<div class="map-ui zoom"><button data-z="in" aria-label="Hineinzoomen">${ico('plus')}</button><button data-z="out" aria-label="Herauszoomen">${ico('minus')}</button><button data-z="fit" aria-label="Ausschnitt zurücksetzen">${ico('reset')}</button></div>`);
    el.querySelector('.zoom').addEventListener('click',e=>{const z=e.target.closest('button')?.dataset.z; if(!z) return;
      if(z==='fit') this.fit(true); else this.svg.transition().duration(300).call(this.zoom.scaleBy, z==='in'?2:.5); });
    new ResizeObserver(()=>this.resize()).observe(el);
  }
  xy(p){ return this.proj([p[1],p[0]]); }
  resize(){
    const w=this.el.clientWidth, h=this.el.clientHeight; if(!w||!h||(w===this.w&&h===this.h)) return;
    this.w=w; this.h=h; this.svg.attr('width',w).attr('height',h);
    this.proj.fitExtent([[8,8],[w-8,h-8]],{type:'MultiPoint',coordinates:[[-117.5,14.3],[-86.7,32.7]]});
    this.gL.selectAll('path').data(this.land.features).join('path').attr('class',d=>d.properties.mx?'land mx':'land').attr('d',this.path);
    this.draw(); this.fit(false);
  }
  set(st){ this.st=st; this.hidePop(); if(this.w){ this.draw(); this.fit(true); } }
  draw(){
    const st=this.st;
    const line=d3.line().curve(d3.curveCatmullRom.alpha(.5));
    this.gR.selectAll('path').data(st.legs,d=>d.id).join('path')
      .attr('class',d=>`route ${d.type} ${d.hi?'hi':''} ${d.dim?'dim':''}`)
      .attr('d',d=>{ const pts=d.pts.map(p=>this.xy(ll(p)));
        if(d.type==='flight'){ const [a,b]=[pts[0],pts[pts.length-1]]; const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1];
          const k=.18; return `M${a}Q${mx-dy*k},${my+dx*k} ${b}`; }
        return line(pts); });
    const g=this.gP.selectAll('g.pt').data(st.points,d=>d.id).join(enter=>{
      const g=enter.append('g'); g.append('circle').attr('class','halo').attr('r',18); g.append('circle').attr('class','dot');
      g.append('text').attr('class','n'); g.append('text').attr('class','lb'); g.append('title'); return g; });
    g.attr('class',d=>`pt ${d.kind} ${d.lbl?'lbl':''}`).on('click',(e,d)=>{ e.stopPropagation(); this.cb(d); });
    g.select('circle.dot').attr('r',d=>d.kind==='stop'?10:d.kind==='minor'?4:5.5);
    g.select('text.n').text(d=>d.num||'');
    g.select('title').text(d=>d.label);
    g.select('text.lb').text(d=>d.kind==='minor'?'':d.label).attr('x',d=>d.kind==='stop'?14:9).attr('y',d=>d.kind==='stop'?4:4);
    this.apply();
  }
  apply(){
    const t=this.t; this.gW.attr('transform',t);
    const W=this.w, H=this.h, pos=new Map();
    this.gP.selectAll('g.pt').each(d=>{const p=this.xy(d.ll); pos.set(d.id,[t.applyX(p[0]),t.applyY(p[1])]);})
      .attr('transform',d=>`translate(${pos.get(d.id)})`);
    const R={}; this.gP.selectAll('g.pt').each(d=>R[d.id]=d.kind==='stop'?11:d.kind==='minor'?4:6);
    const boxes=[...pos.entries()].map(([id,[x,y]])=>({id,b:[x-R[id],y-R[id],x+R[id],y+R[id]]}));
    const hit=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];
    const placed=[];
    this.gP.selectAll('g.pt').sort((a,b)=>(a.num||0)-(b.num||0)).each(function(d){
      const [x,y]=pos.get(d.id), lb=this.querySelector('text.lb'), off=d.kind==='stop'?14:9, wl=d.label.length*6.4+4;
      if(d.kind==='minor'){ return; }
      let ok=false;
      for(const side of (x>W-140?[-1,1]:[1,-1])){
        const bx= side>0?[x+off,y-9,x+off+wl,y+9]:[x-off-wl,y-9,x-off,y+9];
        if(bx[0]<4||bx[2]>W-4||bx[1]<4||bx[3]>H-4) continue;
        if(placed.some(p=>hit(p,bx))||boxes.some(o=>o.id!==d.id&&hit(o.b,bx))) continue;
        lb.setAttribute('text-anchor',side>0?'start':'end'); lb.setAttribute('x',side*off); placed.push(bx); ok=true; break;
      }
      this.classList.toggle('lbl',ok);
      if(d.kind!=='stop') lb.style.opacity=ok?1:0;
    });
    if(this.popFor) this.placePop();
  }
  fit(anim){
    const f=this.st.focus; if(!this.w) return;
    let tr=d3.zoomIdentity;
    if(f&&f.length){
      const ps=f.map(p=>this.xy(p)); const xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]);
      const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
      const pad=this.w<500?36:64, padT=this.w<500?44:72; const dx=Math.max(x1-x0,1e-6), dy=Math.max(y1-y0,1e-6);
      let k=Math.min((this.w-2*pad)/dx,(this.h-pad-padT)/dy); k=Math.max(.8,Math.min(k,2500));
      tr=d3.zoomIdentity.translate(this.w/2-k*(x0+x1)/2, padT+(this.h-pad-padT)/2-k*(y0+y1)/2).scale(k);
    }
    (anim?this.svg.transition().duration(750).ease(d3.easeCubicInOut):this.svg).call(this.zoom.transform,tr);
  }
  focusPoint(p){ const a=this.xy(p), b=this.xy([p[0]+.05,p[1]]); const px=Math.abs(a[1]-b[1]);
    const k=Math.max(this.t.k, Math.min(this.w,this.h)*.5/px);
    const tr=d3.zoomIdentity.translate(this.w/2-k*a[0], this.h/2+20-k*a[1]).scale(k);
    this.svg.transition().duration(600).ease(d3.easeCubicInOut).call(this.zoom.transform,tr).on('end',()=>this.popFor&&this.placePop()); }
  highlight(id){ this.gP.selectAll('g.pt').classed('on',d=>d.id===id).filter(d=>d.id===id).raise(); }
  showPop(d){ this.popFor=d; this.pop.innerHTML=`<b>${esc(d.label)}</b><a href="${gq(d.id)}" target="_blank" rel="noopener">In Google Maps öffnen ${ico('ext')}</a>`; this.pop.hidden=false; this.placePop(); }
  placePop(){ const p=this.xy(this.popFor.ll); this.pop.style.left=this.t.applyX(p[0])+'px'; this.pop.style.top=this.t.applyY(p[1])+'px'; }
  hidePop(){ this.popFor=null; this.pop.hidden=true; }
}

/* ---------- map: Google Maps ---------- */
const GSTYLE=[{elementType:'geometry',stylers:[{color:'#f3f1ec'}]},{elementType:'labels.text.fill',stylers:[{color:'#77726a'}]},{elementType:'labels.text.stroke',stylers:[{color:'#f5f3ee'}]},
 {featureType:'water',elementType:'geometry',stylers:[{color:'#dfe6e8'}]},{featureType:'water',elementType:'labels.text.fill',stylers:[{color:'#93a0a5'}]},
 {featureType:'road',elementType:'geometry',stylers:[{color:'#ffffff'}]},{featureType:'road.highway',elementType:'geometry',stylers:[{color:'#e9e4da'}]},{featureType:'road',elementType:'labels.icon',stylers:[{visibility:'off'}]},
 {featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'poi.park',elementType:'geometry',stylers:[{visibility:'on'},{color:'#e5e9df'}]},{featureType:'transit',stylers:[{visibility:'off'}]},
 {featureType:'administrative',elementType:'geometry.stroke',stylers:[{color:'#c8c2b6'}]},{featureType:'administrative.province',elementType:'labels',stylers:[{visibility:'off'}]},{featureType:'administrative.neighborhood',elementType:'labels',stylers:[{visibility:'off'}]},{featureType:'landscape.natural.terrain',stylers:[{visibility:'simplified'}]}];
class GMap{
  constructor(el, cb){
    this.cb=cb; this.mk=[]; this.ln=[];
    this.map=new google.maps.Map(el,{center:{lat:22,lng:-102},zoom:5,styles:GSTYLE,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false});
    this.iw=new google.maps.InfoWindow();
  }
  set(st){
    this.mk.forEach(m=>m.setMap(null)); this.ln.forEach(l=>l.setMap(null)); this.mk=[]; this.ln=[]; this.byId={};
    const C={flight:'#8d8579',bus:'#3f5d55',car:'#3f5d55',boat:'#6c8a9b'};
    st.legs.forEach(d=>{
      const path=d.pts.map(p=>{const q=ll(p); return {lat:q[0],lng:q[1]};});
      const dashed=d.type==='flight'||d.type==='boat'; const op=d.dim?.25:1;
      this.ln.push(new google.maps.Polyline({map:this.map,path,geodesic:d.type==='flight',strokeColor:d.hi&&d.type==='flight'?'#22211f':C[d.type],strokeOpacity:dashed?0:.9*op,strokeWeight:d.hi?3.5:2.5,
        icons:dashed?[{icon:{path:'M 0,-1 0,1',strokeOpacity:op,scale:2.5},offset:'0',repeat:d.type==='boat'?'7px':'12px'}]:[]}));
    });
    st.points.forEach(d=>{
      const stop=d.kind==='stop';
      const m=new google.maps.Marker({map:this.map,position:{lat:d.ll[0],lng:d.ll[1]},title:d.label,
        label:d.num?{text:String(d.num),color:'#fff',fontSize:'11px',fontWeight:'600'}:undefined,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:stop?11:d.kind==='minor'?4:6,fillColor:stop?'#3f5d55':d.kind==='minor'?'#8a857b':'#22211f',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});
      m.addListener('click',()=>this.cb(d)); this.mk.push(m); this.byId[d.id]=m;
    });
    const f=st.focus||[];
    if(f.length===1){ this.map.panTo({lat:f[0][0],lng:f[0][1]}); this.map.setZoom(14); }
    else if(f.length){ const b=new google.maps.LatLngBounds(); f.forEach(p=>b.extend({lat:p[0],lng:p[1]})); this.map.fitBounds(b,60); }
  }
  focusPoint(p){ this.map.panTo({lat:p[0],lng:p[1]}); if(this.map.getZoom()<14) this.map.setZoom(14); }
  highlight(id){ Object.entries(this.byId||{}).forEach(([k,m])=>m.setZIndex(k===id?999:1)); }
  showPop(d){ const m=this.byId[d.id]; if(!m) return; this.iw.setContent(`<div style="font:13px Inter,sans-serif"><b>${esc(d.label)}</b><br><a href="${gq(d.id)}" target="_blank" rel="noopener" style="color:#3f5d55">In Google Maps öffnen ↗</a></div>`); this.iw.open({map:this.map,anchor:m}); }
}

/* ---------- map state per view ---------- */
let MAP=null, VIEW={v:'overview'};
function mapState(){
  if(VIEW.v==='day'){
    const d=DAYS[VIEW.i], pl=dayPlaces(d);
    return {
      points: pl.map((id,k)=>({id,ll:ll(id),label:P(id)[2],num:k+1,kind:'stop'})),
      legs: LEGS.map(l=>({...l,hi:l.day===d.date,dim:l.day!==d.date})),
      focus: pl.map(ll)
    };
  }
  return {
    points: HUBS.map(h=>({id:h.p,ll:ll(h.p),label:h.label,kind:h.minor?'minor':'hub',day:h.day})),
    legs: LEGS.map(l=>({...l})),
    focus: HUBS.map(h=>ll(h.p)).concat([[22.6,-111.6],[26.4,-99.6]])
  };
}
function onPoint(d){
  if(d.kind!=='stop'){ location.hash='#tag-'+dd(d.day); return; }
  highlight(d.id,false); MAP.showPop&&MAP.showPop(d);
}
function highlight(id, fromList){
  document.querySelectorAll('.timeline li').forEach(li=>li.classList.toggle('on',li.dataset.p===id));
  MAP&&MAP.highlight(id);
  if(fromList){ const pt=mapState().points.find(p=>p.id===id); if(pt&&MAP){ MAP.focusPoint(pt.ll); MAP.showPop(pt); } }
  else { const li=document.querySelector(`.timeline li[data-p="${id}"]`); if(li) li.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function initMap(){
  const el=$('#map');
  const fallback=()=>{ if(MAP) return; MAP=new SvgMap(el,onPoint);
    el.insertAdjacentHTML('beforeend',`<div class="mapnote">Vereinfachte Karte · Google Maps mit API-Schlüssel</div>`);
    addLegend(el); MAP.set(mapState()); };
  if(!CONFIG.googleMapsApiKey) return fallback();
  // Schlüssel ungültig oder Adresse nicht freigegeben -> einfache Karte statt grauer Fehlerkarte
  window.gm_authFailure=()=>{ console.warn('Google Maps: Schlüssel abgelehnt – einfache Karte aktiv'); MAP=null; el.innerHTML=''; el.classList.remove('gm'); fallback(); };
  const to=setTimeout(fallback,6000);
  window.__gmInit=()=>{ clearTimeout(to); if(MAP) return; try{ MAP=new GMap(el,onPoint); el.classList.add('gm'); addLegend(el); MAP.set(mapState()); }catch(e){ fallback(); } };
  const s=document.createElement('script'); s.async=true; s.onerror=()=>{clearTimeout(to);fallback();};
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(CONFIG.googleMapsApiKey)+'&callback=__gmInit&loading=async';
  document.head.appendChild(s);
}
function addLegend(el){ el.insertAdjacentHTML('beforeend',`<div class="legend"><span><i class="f"></i>Flug</span><span><i></i>Bus/Auto</span><span><i class="b"></i>Boot</span></div>`); }

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1);
  let m=h.match(/^tag-(\d{2})$/), i=m?DAYS.findIndex(d=>dd(d.date)===m[1]):-1;
  if(i>=0) VIEW={v:'day',i}; else if(h==='buchungen') VIEW={v:'bookings'}; else VIEW={v:'overview'};
  document.body.className='v-'+VIEW.v;
  nav(VIEW.v, VIEW.i);
  $('#content').innerHTML = VIEW.v==='day'?vDay(VIEW.i):VIEW.v==='bookings'?vBookings():vOverview();
  $('#content').scrollTop=0; if(window.innerWidth<=900 && VIEW.v!=='overview') window.scrollTo({top:0});
  if(MAP) MAP.set(mapState());
}
window.addEventListener('hashchange',route);
header(); route(); initMap();
})();
</script>
